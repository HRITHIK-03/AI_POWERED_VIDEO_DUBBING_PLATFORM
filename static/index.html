<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Dubbing Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="max-w-3xl mx-auto px-4 py-12">
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">AI Video Dubbing Platform</h1>
            <p class="text-slate-600 mt-2">Translate, dub, and synchronize videos across multiple languages seamlessly.</p>
        </div>

        <!-- Upload Card -->
        <div class="bg-white shadow-xl rounded-2xl p-8 border border-slate-100">
            <form id="dubForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Select Video File (.mp4, .mov, .mkv)</label>
                    <input type="file" id="videoFile" accept=".mp4,.mov,.avi,.mkv" required
                        class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer border border-slate-200 rounded-xl p-1">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Target Language</label>
                    <select id="targetLang" class="w-full border border-slate-200 rounded-xl p-3 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="Spanish">Spanish</option>
                        <option value="French">French</option>
                        <option value="German">German</option>
                        <option value="Japanese">Japanese</option>
                        <option value="Mandarin">Mandarin</option>
                    </select>
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg shadow-indigo-100">
                    Start Dubbing Process
                </button>
            </form>

            <!-- Status Section -->
            <div id="statusSection" class="hidden mt-8 pt-6 border-t border-slate-100 space-y-4">
                <div class="flex justify-between items-center text-sm font-medium">
                    <span id="statusText" class="text-indigo-600 font-semibold">Processing...</span>
                    <span id="progressText" class="text-slate-500">0%</span>
                </div>
                <!-- Progress Bar -->
                <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                    <div id="progressBar" class="bg-indigo-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <!-- Results Section -->
            <div id="resultsSection" class="hidden mt-8 pt-6 border-t border-slate-100 space-y-3">
                <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider">Download Outputs</h3>
                <div class="flex flex-wrap gap-3">
                    <a id="downloadVideo" href="#" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2 px-4 rounded-xl transition hidden">Download Dubbed Video</a>
                    <a id="downloadTranscript" href="#" class="bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium py-2 px-4 rounded-xl transition hidden">Download Transcript (.json)</a>
                    <a id="downloadSubtitle" href="#" class="bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium py-2 px-4 rounded-xl transition hidden">Download Subtitles (.srt)</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let pollInterval = null;

        document.getElementById('dubForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('videoFile');
            const targetLang = document.getElementById('targetLang').value;
            const submitBtn = document.getElementById('submitBtn');

            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('target_language', targetLang);

            submitBtn.disabled = true;
            submitBtn.textContent = "Uploading & Queuing...";

            try {
                const response = await fetch('/api/v1/videos/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('statusSection').classList.remove('hidden');
                    startPolling(data.job_id);
                } else {
                    alert(data.detail || "Upload failed");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Start Dubbing Process";
                }
            } catch (err) {
                alert("Error connecting to server.");
                submitBtn.disabled = false;
                submitBtn.textContent = "Start Dubbing Process";
            }
        });

        function startPolling(jobId) {
            pollInterval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/v1/videos/status/${jobId}`);
                    const job = await res.json();

                    document.getElementById('statusText').textContent = `Status: ${job.status}`;
                    document.getElementById('progressText').textContent = `${job.progress}%`;
                    document.getElementById('progressBar').style.width = `${job.progress}%`;

                    if (job.status === 'COMPLETED') {
                        clearInterval(pollInterval);
                        document.getElementById('statusText').textContent = "Processing Complete!";
                        document.getElementById('submitBtn').disabled = false;
                        document.getElementById('submitBtn').textContent = "Start Dubbing Process";
                        
                        // Show download buttons
                        if (job.output_video_url) {
                            const vBtn = document.getElementById('downloadVideo');
                            vBtn.href = job.output_video_url;
                            vBtn.classList.remove('hidden');
                        }
                        if (job.transcript_url) {
                            const tBtn = document.getElementById('downloadTranscript');
                            tBtn.href = job.transcript_url;
                            tBtn.classList.remove('hidden');
                        }
                        if (job.subtitle_url) {
                            const sBtn = document.getElementById('downloadSubtitle');
                            sBtn.href = job.subtitle_url;
                            sBtn.classList.remove('hidden');
                        }
                        document.getElementById('resultsSection').classList.remove('hidden');
                    } else if (job.status === 'FAILED') {
                        clearInterval(pollInterval);
                        document.getElementById('statusText').textContent = `Failed: ${job.error_message || 'Unknown error'}`;
                        document.getElementById('statusText').className = "text-red-600 font-semibold";
                        document.getElementById('submitBtn').disabled = false;
                        document.getElementById('submitBtn').textContent = "Start Dubbing Process";
                    }
                } catch (e) {
                    console.error("Polling error", e);
                }
            }, 2000);
        }
    </script>
</body>
</html>
