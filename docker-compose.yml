version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./dubbing.db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=local
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=info -c 1
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=sqlite:///./dubbing.db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=local
    depends_on:
      redis:
        condition: service_healthy